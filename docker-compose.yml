name: prostor

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prostor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prostor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prostor}
      POSTGRES_DB: ${POSTGRES_DB:-prostor}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prostor} -d ${POSTGRES_DB:-prostor}"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-small}
    container_name: prostor-backend
    env_file:
      - path: .env.secrets
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Полностью настраиваемая строка подключения — можно указать любой хост/порт
      # (внешний PostgreSQL, изменить пароль и т.д.) без пересборки образа.
      # По умолчанию — контейнер `postgres` внутри compose-сети.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-prostor}:${POSTGRES_PASSWORD:-prostor}@postgres:5432/${POSTGRES_DB:-prostor}}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-45}
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - hf_cache:/opt/hf-cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prostor-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Runtime-подмена без пересборки: envsubst в nginx подставит
      # BACKEND_URL в /api/ proxy_pass при старте контейнера.
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      NGINX_ENVSUBST_FILTER_VARIABLES: BACKEND_URL
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
  hf_cache:
