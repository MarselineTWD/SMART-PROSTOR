services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart-prostor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - prostor_outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smart-prostor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  prostor_outputs:
